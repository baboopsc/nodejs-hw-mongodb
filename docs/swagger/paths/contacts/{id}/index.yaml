get:
  tags:
    - Contacts
  summary: Get contact by ID
  operationId: getContactById
  description: Retrieve a single contact by its ID
  security:
    - bearerAuth: []
  parameters:
    - in: path
      name: contactId
      required: true
      schema:
        type: string
        example: 65ca67e7ae7f10c88b598384
      description: Contact ID
  responses:
    '200':
      description: Successfully found contact
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              message:
                type: string
                example: Successfully found contact with id 65ca67e7ae7f10c88b598384!
              data:
                $ref: ../../../components/contact.yaml
    '401':
      $ref: ../../../components/responses/401.yaml
    '404':
      $ref: ../../../components/responses/404.yaml

patch:
  tags:
    - Contacts
  summary: Update contact by ID
  operationId: patchContact
  description: Update an existing contact by its ID
  security:
    - bearerAuth: []
  parameters:
    - in: path
      name: contactId
      required: true
      schema:
        type: string
        example: 65ca67e7ae7f10c88b598384
      description: Contact ID
  requestBody:
    content:
      multipart/form-data:
        schema:
          type: object
          properties:
            name:
              type: string
              minLength: 3
              maxLength: 20
              example: John Doe
            phoneNumber:
              type: string
              minLength: 3
              maxLength: 20
              example: '+380001234567'
            email:
              type: string
              format: email
              example: john@example.com
            isFavourite:
              type: boolean
              example: false
            contactType:
              type: string
              enum: [work, home, personal]
              example: personal
            photo:
              type: string
              format: binary
  responses:
    '200':
      description: Successfully updated contact
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              message:
                type: string
                example: Successfully patched a contact!
              data:
                $ref: ../../../components/contact.yaml
    '400':
      $ref: ../../../components/responses/400.yaml
    '401':
      $ref: ../../../components/responses/401.yaml
    '404':
      $ref: ../../../components/responses/404.yaml

delete:
  tags:
    - Contacts
  summary: Delete contact by ID
  operationId: deleteContact
  description: Delete a contact by its ID
  security:
    - bearerAuth: []
  parameters:
    - in: path
      name: contactId
      required: true
      schema:
        type: string
        example: 65ca67e7ae7f10c88b598384
      description: Contact ID
  responses:
    '204':
      description: Successfully deleted contact
    '401':
      $ref: ../../../components/responses/401.yaml
    '404':
      $ref: ../../../components/responses/404.yaml